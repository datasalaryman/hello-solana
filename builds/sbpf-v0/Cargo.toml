[package]
name = "hello-solana-sbpf-v0"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "hello_solana"
path = "../../src/lib.rs"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
ahash = { version = "=0.8.11", optional = true }
anchor-attribute-access-control = { version = "=0.30.1", optional = true }
anchor-attribute-account = { version = "=0.30.1", optional = true }
anchor-attribute-constant = { version = "=0.30.1", optional = true }
anchor-attribute-error = { version = "=0.30.1", optional = true }
anchor-attribute-event = { version = "=0.30.1", optional = true }
anchor-attribute-program = { version = "=0.30.1", optional = true }
anchor-derive-accounts = { version = "=0.30.1", optional = true }
anchor-derive-serde = { version = "=0.30.1", optional = true }
anchor-derive-space = { version = "=0.30.1", optional = true }
anchor-lang = "=0.30.1"
anchor-syn = { version = "=0.30.1", optional = true }
blake3 = { version = "=1.5.0", optional = true }
borsh = { version = "=0.10.3", optional = true }
jobserver = { version = "=0.1.26", optional = true }

[profile.release]
overflow-checks = true

[workspace]
